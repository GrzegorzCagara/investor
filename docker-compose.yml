services:
  db:
    image: postgres:17
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: investor
      POSTGRES_USER: investor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investor -d investor"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    mem_limit: 1g
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/investor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ustaw ANTHROPIC_API_KEY w .env}
      CONTACT_EMAIL: ${CONTACT_EMAIL:?ustaw CONTACT_EMAIL w .env}
      INVESTOR_API_TOKEN: ${INVESTOR_API_TOKEN:?ustaw INVESTOR_API_TOKEN w .env}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase.json
    volumes:
      - ./secrets/firebase.json:/run/secrets/firebase.json:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_BIND:-127.0.0.1}:8080:8080"

volumes:
  pgdata:
